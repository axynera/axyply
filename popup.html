<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AxyPly</title><style>*{box-sizing:border-box}body{margin:0;width:310px;padding:18px;background:#0f1115;color:#f5f7fa;font:14px system-ui,sans-serif}h1{font-size:20px;margin:0}.sub,.hint{color:#9299a5;font-size:12px}.card{margin-top:16px;padding:14px;border:1px solid #262a33;border-radius:16px;background:#171a20}.row{display:flex;align-items:center;justify-content:space-between}.label{font-weight:700}.switch{width:48px;height:28px;border:0;border-radius:20px;background:#3a3f49;padding:3px;cursor:pointer}.switch i{display:block;width:22px;height:22px;border-radius:50%;background:#fff;transition:.18s}.switch.on{background:#35c56b}.switch.on i{transform:translateX(20px)}select{width:100%;margin-top:10px;padding:9px;border-radius:10px;background:#101218;color:#fff;border:1px solid #303540}.count{font-size:28px;font-weight:800;margin-top:4px}.footer{margin-top:14px;color:#777f8d;font-size:10px;text-align:center}</style></head><body><h1>AxyPly</h1><div class="sub">YouTube Auto Continue</div><div class="card"><div class="row"><div><div class="label">Auto Continue</div><div class="hint" id="status">Active</div></div><button id="toggle" class="switch on"><i></i></button></div></div><div class="card"><div class="label">Click delay</div><select id="delay"><option value="0">Instant</option><option value="500">0.5 second</option><option value="1000">1 second</option><option value="2000">2 seconds</option></select></div><div class="card"><div class="label">Videos continued</div><div id="count" class="count">0</div><div class="hint">Saved locally on this browser</div></div><div class="footer">AxyPly v2.0.0</div><script src="popup.js"></script></body></html>
